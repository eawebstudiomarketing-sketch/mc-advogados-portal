# Resumo das rotinas do dia em HTML para o Zap do Maurício. Desde 30/10 o envio é feito pelo próprio portal
# quando o Maurício envia o relatório dele (de dono); este fluxo só roda se for chamado à mão.
name: Relatório de rotinas do dia

on:
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Gerar e enviar
        run: |
          curl -fsS -m 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://mcadvogados.app.br/api/cron/relatorio-rotina"
