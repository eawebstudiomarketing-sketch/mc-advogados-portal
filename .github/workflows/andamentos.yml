# Andamentos dos processos: de hora em hora, 07h–22h da Bahia (UTC-3).
# O Vercel Cron (vercel.json) fica de reserva caso o GitHub pause o agendamento.
name: Andamentos dos processos

on:
  schedule:
    - cron: "15 10-23,0,1 * * *"
  workflow_dispatch:

jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ler andamentos
        run: |
          curl -fsS -m 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://mcadvogados.app.br/api/cron/andamentos"
